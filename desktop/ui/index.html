<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>霍格沃茨</title>
  <link rel="stylesheet" href="launcher.css">
</head>
<body>
  <main>
    <header>
      <h1>霍格沃茨</h1>
      <p class="sub">选一座城堡进去。局域网里的服务器会自动出现。</p>
    </header>
    <p id="status" role="status" aria-live="polite"></p>
    <section>
      <div class="row head"><h2>局域网</h2><button id="rescan" type="button">重新查找</button></div>
      <ul id="found" class="list"><li class="empty">正在查找…</li></ul>
    </section>
    <section id="known-box" hidden>
      <h2>去过的</h2>
      <ul id="known" class="list"></ul>
    </section>
    <form id="manual">
      <h2>手动输入</h2>
      <div class="row">
        <input id="addr" placeholder="10.37.1.20:7777，或粘贴游戏里的邀请链接" autocomplete="off" spellcheck="false" aria-label="服务器地址">
        <button type="submit" class="primary">进入</button>
      </div>
    </form>
    <section id="agent">
      <h2>连接我的 Agent</h2>
      <p class="hint">让 Claude 用你的巫师身份玩、替你写咒语。它连的是你上次进入的服务器；密钥从系统钥匙串里读，不会写进任何配置文件。</p>
      <div class="row wrap">
        <button id="to-desktop" type="button" class="primary">写入 Claude Desktop</button>
        <button id="to-code" type="button">添加到 Claude Code</button>
      </div>
      <div class="row cmd"><code id="code-cmd"></code><button id="copy" type="button" class="quiet">复制</button></div>
      <p id="agent-status" class="hint" role="status" aria-live="polite"></p>
    </section>
    <footer id="keys">进入游戏后：F11 全屏，Ctrl+Shift+S 回到这里换服务器。密钥保存在系统钥匙串里。</footer>
  </main>
  <script src="launcher.js"></script>
</body>
</html>
